<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Caribbean Cruise Route Mapper</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <!-- Nautical-but-legible type: Cinzel (engraved maritime capitals) for titles,
       Spectral (a refined, readable serif) for labels, dates and body text. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0a1628;
      --ocean: #1a3a5c;
      --blue: #1e6fa8;
      --gold: #c8a84b;
      --gold-light: #e8c96b;
      --white: #f0ede6;
      --gray: #8a9bb0;
      --panel: #0d1f36;
      --border: #1e3a5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #071020 0%, #122040 100%);
      border-bottom: 2px solid var(--gold);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    header .anchor { font-size: 1.9rem; line-height: 1; }
    header h1 { font-size: 1.3rem; letter-spacing: 0.07em; color: var(--gold-light); }
    header p  { font-size: 0.72rem; color: var(--gray); font-family: Arial,sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      min-height: 0;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      font-size: 0.74rem;
      color: var(--gray);
      margin-bottom: 4px;
      font-family: Arial, sans-serif;
      letter-spacing: 0.04em;
    }

    select, input[type="date"] {
      width: 100%;
      padding: 8px 10px;
      background: #071020;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--white);
      font-size: 0.84rem;
      font-family: Arial, sans-serif;
      transition: border-color 0.2s;
    }
    select:focus, input:focus { outline: none; border-color: var(--gold); }
    select option { background: #071020; }

    .form-group { margin-bottom: 11px; }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 3px;
      font-size: 0.82rem;
      font-family: Arial, sans-serif;
      cursor: pointer;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #b8942a 0%, var(--gold-light) 100%);
      color: #07100a;
      font-weight: bold;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      margin-top: 7px;
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(200,168,75,0.1); }
    .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Itinerary preview ───────────────────────────────────── */
    .itin-preview {
      background: #071020;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 11px;
      min-height: 60px;
    }
    .itin-meta {
      font-size: 0.7rem;
      color: var(--gray);
      font-family: Arial, sans-serif;
      margin-bottom: 8px;
    }
    .itin-meta span { color: var(--gold-light); }

    .port-list { list-style: none; }
    .port-list li {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 4px 0;
      font-size: 0.78rem;
      font-family: Arial, sans-serif;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      line-height: 1.3;
    }
    .port-list li:last-child { border-bottom: none; }
    .pday {
      font-size: 0.66rem;
      color: var(--gray);
      min-width: 28px;
      flex-shrink: 0;
      padding-top: 1px;
    }
    .pdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .pdot-home   { background: var(--gold-light); }
    .pdot-port   { background: var(--gold); }
    .pdot-scenic { background: #4a90d9; }
    .pdot-sea    { background: #2a3a4a; border: 1px solid #3a5a7a; }

    /* ── Map area ────────────────────────────────────────────── */
    .map-area {
      position: relative;
      background: #050e18;
      overflow: hidden;
    }

    #cruise-map { width: 100%; height: 100%; display: block; cursor: grab; }
    #cruise-map:active { cursor: grabbing; }

    .zoom-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .zoom-btn {
      width: 32px; height: 32px;
      background: rgba(7,16,32,0.88);
      border: 1px solid var(--border);
      color: var(--gold);
      font-size: 1.1rem;
      border-radius: 3px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .zoom-btn:hover { background: rgba(30,58,92,0.9); }

    .zoom-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: Arial, sans-serif;
      font-size: 0.68rem;
      color: rgba(138,155,176,0.7);
      pointer-events: none;
      white-space: nowrap;
    }

    .placeholder-msg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      color: var(--gray);
      font-family: Arial, sans-serif;
      pointer-events: none;
    }
    .placeholder-msg .icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.5; }
    .placeholder-msg p { font-size: 0.85rem; line-height: 1.7; }

    /* SVG map styling lives in the JS constant MAP_CSS (single source of truth),
       injected both into this page and into every exported SVG so the render and
       the export always match. */
  </style>
</head>
<body>

<header>
  <span class="anchor">&#9875;</span>
  <div>
    <h1>Royal Caribbean Cruise Route Mapper</h1>
    <p>Real Itineraries &bull; Interactive Map &bull; SVG Export</p>
  </div>
</header>

<div class="app">
  <aside class="sidebar">

    <div>
      <div class="section-title">Select Your Cruise</div>

      <div class="form-group">
        <label for="itin-select">Itinerary <span id="itin-count" style="color:var(--gray);font-size:0.7rem;"></span></label>
        <select id="itin-select">
          <option value="">-- Choose an itinerary --</option>
        </select>
      </div>

      <div class="form-group date-row">
        <div>
          <label for="date-start">Departure</label>
          <input type="date" id="date-start" />
        </div>
        <div>
          <label for="date-end">Return</label>
          <input type="date" id="date-end" />
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Itinerary Preview</div>
      <div class="itin-preview" id="itin-preview">
        <p style="color:var(--gray);font-size:0.78rem;font-family:Arial,sans-serif;">
          Select an itinerary to preview ports of call.
        </p>
      </div>
    </div>

    <div>
      <button class="btn btn-primary" id="generate-btn">&#9654; Generate Route Map</button>
    </div>

    <div>
      <div class="section-title">Export</div>
      <div class="form-group">
        <label for="export-format">Frame &amp; Size</label>
        <select id="export-format">
          <option value="wide">Current View (wide)</option>
          <option value="square">3.5&Prime; &times; 3.5&Prime; Square</option>
          <option value="circle">3.8&Prime; Porthole (circle)</option>
        </select>
      </div>
      <button class="btn btn-secondary" id="export-btn" disabled>&#8595; Export as SVG</button>
    </div>

  </aside>

  <main class="map-area">
    <div class="placeholder-msg" id="placeholder">
      <div class="icon">&#9875;</div>
      <p>Select a Royal Caribbean itinerary<br>and click <strong>Generate Route Map</strong>.</p>
    </div>

    <svg id="cruise-map"></svg>

    <div class="zoom-controls" id="zoom-controls" style="display:none;">
      <button class="zoom-btn" id="zoom-in"  title="Zoom in">+</button>
      <button class="zoom-btn" id="zoom-out" title="Zoom out">−</button>
      <button class="zoom-btn" id="zoom-reset" title="Reset view" style="font-size:0.7rem;">&#8635;</button>
    </div>

    <div class="zoom-hint" id="zoom-hint" style="display:none;">
      Scroll to zoom &bull; Drag to pan
    </div>
  </main>
</div>

// Build the itinerary dropdown from the data, grouped by region (covers the
// whole fleet, so adding ships only requires adding to ITINERARIES).
(function buildItinOptions(){
  const order = ['Caribbean','Caribbean_South','Atlantic','Mediterranean','Northern Europe','Alaska','Pacific Mexico','SE Asia'];
  const label = { Caribbean:'Caribbean & Bahamas', Caribbean_South:'Southern Caribbean', Atlantic:'Bermuda & Atlantic', Mediterranean:'Mediterranean', 'Northern Europe':'Northern Europe', Alaska:'Alaska', 'Pacific Mexico':'Mexican Riviera', 'SE Asia':'Southeast Asia' };
  const byRegion = {};
  for (const [key, it] of Object.entries(ITINERARIES)) (byRegion[it.region] = byRegion[it.region] || []).push([key, it]);
  const regions = order.filter(r => byRegion[r]).concat(Object.keys(byRegion).filter(r => !order.includes(r)));
  const frag = document.createDocumentFragment();
  for (const r of regions) {
    const og = document.createElement('optgroup');
    og.label = label[r] || r;
    byRegion[r].sort((a, b) => a[1].ship.localeCompare(b[1].ship));
    for (const [key, it] of byRegion[r]) {
      const o = document.createElement('option');
      o.value = key;
      o.textContent = `${it.ship} — ${it.name} (${it.nights} Nt)`;
      og.appendChild(o);
    }
    frag.appendChild(og);
  }
  itinSelect.appendChild(frag);
  const ships = new Set(Object.values(ITINERARIES).map(i => i.ship)).size;
  const c = document.getElementById('itin-count');
  if (c) c.textContent = `· ${Object.keys(ITINERARIES).length} sailings, ${ships} ships`;
})();

// ─── Pre-load world data ──────────────────────────────────────────────────────
async function loadWorld() {
  // 50m balances coastline detail with correct geometry. (The 10m build has
  // reversed polygon winding that breaks rendering/containment, so it's avoided.)
  const sources = [
    'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json',
    'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
  ];
  for (const url of sources) {
    try {
      const res = await fetch(url);
      if (res.ok) { worldData = await res.json(); return; }
    } catch (e) { /* try next source */ }
  }
}
loadWorld();

// ─── Itinerary select handler ─────────────────────────────────────────────────
itinSelect.addEventListener('change', () => {
  const key = itinSelect.value;
  if (!key) {
    previewEl.innerHTML = '<p style="color:var(--gray);font-size:0.78rem;font-family:Arial,sans-serif;">Select an itinerary to preview ports of call.</p>';

  }
  const itin = ITINERARIES[key];

    const d = new Date(); d.setDate(d.getDate() + 30);

  }

    const d = new Date(dateStart.value + 'T00:00:00');

// Captain's / ship's wheel: hub, rim, 8 spokes ending in handle knobs.
function drawShipsWheel(parent, cx, cy, r) {
  const g = parent.append('g').attr('transform', `translate(${cx},${cy})`);
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * 2 * Math.PI, dx = Math.cos(a), dy = Math.sin(a);
    g.append('line').attr('x1', dx*r*0.18).attr('y1', dy*r*0.18)
      .attr('x2', dx*r*1.30).attr('y2', dy*r*1.30)
      .attr('stroke', '#c8a84b').attr('stroke-width', r*0.11).attr('stroke-linecap', 'round');
    g.append('circle').attr('cx', dx*r*1.32).attr('cy', dy*r*1.32).attr('r', r*0.12)
      .attr('fill', '#e8c96b').attr('stroke', '#6e5526').attr('stroke-width', 1);
  }

// Nautical compass rose: ticked ring + faceted 8-point star + cardinal letters.
function drawCompassRose(parent, cx, cy, r, lf) {
  const g = parent.append('g').attr('transform', `translate(${cx},${cy})`);
  const D = a => [Math.sin(a), -Math.cos(a)];
  g.append('circle').attr('r', r).attr('fill', 'rgba(6,18,28,0.82)').attr('stroke', '#b98d3e').attr('stroke-width', 1.3);
  g.append('circle').attr('r', r*0.9).attr('fill', 'none').attr('stroke', '#6e5526').attr('stroke-width', 0.6);
  for (let i = 0; i < 72; i++) {
    const a = i*Math.PI/36, o = (i%9===0) ? r*0.74 : r*0.84, e = r*0.9, s = D(a);
    g.append('line').attr('x1', s[0]*o).attr('y1', s[1]*o).attr('x2', s[0]*e).attr('y2', s[1]*e)
      .attr('stroke', '#8a6d2a').attr('stroke-width', 0.5);
  }
  const long = r*0.70, short = r*0.40, base = r*0.13;
  for (let i = 0; i < 8; i++) {
    const a = i*Math.PI/4, len = (i%2===0) ? long : short, north = (i===0);
    const T = D(a).map(v => v*len), Lb = D(a+Math.PI/2).map(v => v*base), Rb = D(a-Math.PI/2).map(v => v*base);
    g.append('polygon').attr('points', `0,0 ${Lb} ${T}`).attr('fill', north ? '#c14b39' : (i%2===0 ? '#e8c96b' : '#b98d3e'));
    g.append('polygon').attr('points', `0,0 ${Rb} ${T}`).attr('fill', north ? '#8f3024' : (i%2===0 ? '#a8801f' : '#6e5526'));
  }
  g.append('circle').attr('r', r*0.10).attr('fill', '#e8c96b').attr('stroke', '#6e5526').attr('stroke-width', 1);
  [['N',0],['E',Math.PI/2],['S',Math.PI],['W',3*Math.PI/2]].forEach(([l,a]) => {
    const p = D(a).map(v => v*(r + lf*0.78));
    g.append('text').attr('class', 'compass-letter').attr('x', p[0]).attr('y', p[1] + lf*0.35).attr('font-size', lf).text(l);
  });
  return g;
}

function drawStar(g, cx, cy, r) {

// Decorative frame: a "chart neatline" (double rule with minute ticks + corner

function drawFrame(svg, L) {
  const { shape, W, H } = L, g = svg.append('g');

    g.append('circle').attr('cx', L.cx).attr('cy', L.cy).attr('r', L.R + L.ring*0.92).attr('fill', 'none').attr('stroke', '#6e5526').attr('stroke-width', 1);
    // fine tick ring just inside the brass band (like a compass card)
    for (let i = 0; i < 120; i++) {
      const a = i*Math.PI/60, r1 = L.R + 2, r2 = L.R + (i%5===0 ? L.ring*0.34 : L.ring*0.2);
      g.append('line').attr('x1', L.cx+Math.cos(a)*r1).attr('y1', L.cy+Math.sin(a)*r1)
        .attr('x2', L.cx+Math.cos(a)*r2).attr('y2', L.cy+Math.sin(a)*r2).attr('stroke', '#8a6d2a').attr('stroke-width', 0.5);
    }
    for (let i = 0; i < 16; i++) {
      const a = i/16*2*Math.PI, br = L.R + L.ring*0.5;
      g.append('circle').attr('cx', L.cx + Math.cos(a)*br).attr('cy', L.cy + Math.sin(a)*br).attr('r', 2.6)
        .attr('fill', '#2a2110').attr('stroke', '#e8c96b').attr('stroke-width', 0.8);
    }
  } else {
    const m = L.m, m2 = m + 6;
    g.append('rect').attr('x', m).attr('y', m).attr('width', W-2*m).attr('height', H-2*m).attr('rx', 6)
      .attr('fill', 'none').attr('stroke', '#b98d3e').attr('stroke-width', shape === 'square' ? 3 : 2.5);
    g.append('rect').attr('x', m2).attr('y', m2).attr('width', W-2*m2).attr('height', H-2*m2).attr('rx', 4)
      .attr('fill', 'none').attr('stroke', '#6e5526').attr('stroke-width', 1);
    // minute ticks between the two rules
    const step = 20;
    for (let x = m + step; x < W - m - 4; x += step) {
      g.append('line').attr('x1', x).attr('y1', m).attr('x2', x).attr('y2', m2).attr('stroke', '#8a6d2a').attr('stroke-width', 0.7);
      g.append('line').attr('x1', x).attr('y1', H-m).attr('x2', x).attr('y2', H-m2).attr('stroke', '#8a6d2a').attr('stroke-width', 0.7);
    }
    for (let y = m + step; y < H - m - 4; y += step) {
      g.append('line').attr('x1', m).attr('y1', y).attr('x2', m2).attr('y2', y).attr('stroke', '#8a6d2a').attr('stroke-width', 0.7);
      g.append('line').attr('x1', W-m).attr('y1', y).attr('x2', W-m2).attr('y2', y).attr('stroke', '#8a6d2a').attr('stroke-width', 0.7);
    }
    [[m,m],[W-m,m],[m,H-m],[W-m,H-m]].forEach(p => drawStar(g, p[0], p[1], shape === 'square' ? 6 : 5));
  }
}

// ════════════════════════════════════════════════════════════════════════════
//  PROJECTION + GEOGRAPHY + ROUTE
// ════════════════════════════════════════════════════════════════════════════

function dedupe(arr) {
  const seen = new Set();
  return arr.filter(w => { if (seen.has(w.name)) return false; seen.add(w.name); return true; });
}

// Fit a Mercator projection to an area. fitMode 'region' adds geographic context;
// 'route' fits tightly so the route fills the frame. Uses corner POINTS (a
// MultiPoint) to avoid the spherical-polygon winding issue that fits the globe.
function makeProjection(waypoints, area, fitMode, region) {
  const lons = waypoints.map(w => w.lon), lats = waypoints.map(w => w.lat);
  let lon0 = Math.min(...lons), lon1 = Math.max(...lons), lat0 = Math.min(...lats), lat1 = Math.max(...lats);
  if (fitMode === 'region') {
    const lonSpan = (lon1-lon0) || 10, latSpan = (lat1-lat0) || 8;
    lon0 -= lonSpan*0.28; lon1 += lonSpan*0.28; lat0 -= latSpan*0.28; lat1 += latSpan*0.28;
    const b = REGION_BOUNDS[region];
    if (b) { lon0 = Math.min(lon0,b.lon0); lon1 = Math.max(lon1,b.lon1); lat0 = Math.min(lat0,b.lat0); lat1 = Math.max(lat1,b.lat1); }
  } else {
    const lonSpan = (lon1-lon0) || 6, latSpan = (lat1-lat0) || 5;
    lon0 -= lonSpan*0.18; lon1 += lonSpan*0.18; lat0 -= latSpan*0.18; lat1 += latSpan*0.18;
  }
  const mp = { type: 'MultiPoint', coordinates: [[lon0,lat0],[lon1,lat0],[lon1,lat1],[lon0,lat1]] };
  return d3.geoMercator().fitSize([area.w, area.h], mp);
}

function drawGeography(g, projection, path, laser) {
  // For laser exports keep only the land fill (graticule + coastline strokes
  // create stray engrave marks), so the design stays clean.
  if (!laser) g.append('path').datum(d3.geoGraticule().step([10,10])()).attr('class', 'graticule').attr('d', path);
  g.append('path').datum(topojson.feature(worldData, worldData.objects.countries)).attr('class', 'land').attr('d', path);
  if (!laser) g.append('path').datum(topojson.mesh(worldData, worldData.objects.countries, (a,b) => a !== b)).attr('class', 'borders').attr('d', path);
}

// ── Geometry cropping for the circle export ──────────────────────────────────
// Laser software ignores SVG clip-paths, so for the porthole we physically clip
// the geography path data to the circle (rect crops are handled by clipExtent).
function parseSubpaths(d) {
  return d.split('M').filter(s => s.trim()).map(s =>
    s.replace(/Z/ig, '').split('L').map(pr => pr.split(',').map(Number)).filter(p => p.length === 2 && !isNaN(p[0]) && !isNaN(p[1])));
}
function sutherlandHodgman(subject, clip) {
  // clip = convex polygon; "inside" = same side as the clip's centroid.
  const cen = clip.reduce((a,p) => [a[0]+p[0]/clip.length, a[1]+p[1]/clip.length], [0,0]);
  let out = subject;
  for (let c = 0; c < clip.length && out.length; c++) {
    const A = clip[c], B = clip[(c+1)%clip.length];
    const side = p => (B[0]-A[0])*(p[1]-A[1]) - (B[1]-A[1])*(p[0]-A[0]);
    const ref = Math.sign(side(cen)) || 1;
    const inside = p => Math.sign(side(p)) === ref || side(p) === 0;
    const inp = out; out = [];
    for (let k = 0; k < inp.length; k++) {
      const P = inp[k], Q = inp[(k+1)%inp.length], Pin = inside(P), Qin = inside(Q);
      if (Pin) out.push(P);
      if (Pin !== Qin) {
        const sp = side(P), sq = side(Q), t = sp/(sp-sq);
        out.push([P[0]+t*(Q[0]-P[0]), P[1]+t*(Q[1]-P[1])]);
      }
    }
  }
  return out;
}
function clipSegmentToCircle(P, Q, cx, cy, r) {
  // returns the [t0,t1] sub-segment of P->Q inside the circle, or null
  const dx = Q[0]-P[0], dy = Q[1]-P[1];
  const fx = P[0]-cx, fy = P[1]-cy;
  const a = dx*dx+dy*dy, b = 2*(fx*dx+fy*dy), c = fx*fx+fy*fy-r*r;
  if (a < 1e-9) return (c <= 0) ? [P, Q] : null;
  const disc = b*b-4*a*c; if (disc < 0) return null;
  const sd = Math.sqrt(disc);
  let t0 = Math.max(0, (-b-sd)/(2*a)), t1 = Math.min(1, (-b+sd)/(2*a));
  if (t0 >= t1) return null;
  return [[P[0]+t0*dx, P[1]+t0*dy], [P[0]+t1*dx, P[1]+t1*dy]];
}
function clipPathToCircle(d, cx, cy, r, closed) {
  const N = 96, ng = [];
  for (let i = 0; i < N; i++) { const a = i/N*2*Math.PI; ng.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r]); }
  const fmt = p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  let out = '';
  for (const sub of parseSubpaths(d)) {
    if (closed) {
      const cl = sutherlandHodgman(sub, ng);
      if (cl.length >= 3) out += 'M' + cl.map(fmt).join('L') + 'Z';
    } else {
      for (let k = 0; k < sub.length-1; k++) {
        const seg = clipSegmentToCircle(sub[k], sub[k+1], cx, cy, r);
        if (seg) out += 'M' + fmt(seg[0]) + 'L' + fmt(seg[1]);
      }
    }
  }
  return out;
}

// ── Laser-export helpers ─────────────────────────────────────────────────────
function polysToPath(polys) {
  return polys.map(p => 'M' + p.map(q => `${q[0].toFixed(1)},${q[1].toFixed(1)}`).join('L') + 'Z').join('');
}
// Subtract an axis-aligned rectangle from a set of polygons (returns up to four
// rectangular slices per polygon = the polygon minus the rect). Used to clear a
// map-free buffer around the wheel / banner / legend / compass so they engrave
// visibly instead of on top of the map.
function subtractRect(polys, b, bounds) {
  const out = [];
  for (const poly of polys) {
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for (const p of poly) { x0=Math.min(x0,p[0]); y0=Math.min(y0,p[1]); x1=Math.max(x1,p[0]); y1=Math.max(y1,p[1]); }
    if (x1<=b.x0 || x0>=b.x1 || y1<=b.y0 || y0>=b.y1) { out.push(poly); continue; } // no overlap
    const pieces = [
      [bounds.x0, bounds.y0, b.x0, bounds.y1],   // left of rect
      [b.x1, bounds.y0, bounds.x1, bounds.y1],   // right of rect
      [b.x0, bounds.y0, b.x1, b.y0],             // above rect (within its x-span)
      [b.x0, b.y1, b.x1, bounds.y1],             // below rect
    ];
    for (const [ax,ay,bx,by] of pieces) {
      if (ax>=bx || ay>=by) continue;
      const cl = sutherlandHodgman(poly, [[ax,ay],[bx,ay],[bx,by],[ax,by]]);
      if (cl.length >= 3) out.push(cl);
    }
  }
  return out;
}
function subtractRects(d, rects) {
  let polys = parseSubpaths(d).filter(p => p.length >= 3);
  let bx0=1e9,by0=1e9,bx1=-1e9,by1=-1e9;
  for (const p of polys) for (const q of p) { bx0=Math.min(bx0,q[0]); by0=Math.min(by0,q[1]); bx1=Math.max(bx1,q[0]); by1=Math.max(by1,q[1]); }
  const bounds = { x0:bx0-2, y0:by0-2, x1:bx1+2, y1:by1+2 };
  for (const r of rects) polys = subtractRect(polys, r, bounds);
  return polysToPath(polys);
}
// Convert a route path into discrete dash segments (real geometry) because
// laser software ignores stroke-dasharray and renders it as a solid line.
function routeToDashes(d, dash, gap, rects) {
  const ns = 'http://www.w3.org/2000/svg';
  const tmp = document.createElementNS(ns, 'svg');
  tmp.setAttribute('style', 'position:absolute;width:0;height:0;visibility:hidden');
  const pth = document.createElementNS(ns, 'path'); pth.setAttribute('d', d);
  tmp.appendChild(pth); document.body.appendChild(tmp);
  const total = pth.getTotalLength();
  const segs = [];
  for (let pos = 0; pos < total; pos += dash + gap) {
    const a = pth.getPointAtLength(pos), b = pth.getPointAtLength(Math.min(pos + dash, total));
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    if (rects.some(r => mx>=r.x0 && mx<=r.x1 && my>=r.y0 && my<=r.y1)) continue;
    segs.push(`M${a.x.toFixed(1)},${a.y.toFixed(1)}L${b.x.toFixed(1)},${b.y.toFixed(1)}`);
  }
  document.body.removeChild(tmp);
  return segs;
}
// Banner box size (shared by drawBanner and the buffer calc).
function bannerBox(L, itin, start, end) {
  let titleF = L.bannerTitleF, dateF = L.bannerDateF;
  const dates = (start && end) ? `${formatDate(start)}  –  ${formatDate(end)}` : `${itin.nights} Nights`;
  const padX = 22, avail = Math.max(120, L.bannerMaxW - padX*2);
  let tW = itin.name.length * titleF * 0.62, dW = dates.length * dateF * 0.5;
  if (tW > avail) { titleF *= avail/tW; tW = avail; }
  if (dW > avail) { dateF *= avail/dW; dW = avail; }
  const w = Math.min(L.bannerMaxW, Math.max(tW, dW) + padX*2);
  return { x: L.cx - w/2, y: L.bannerTop, w, h: L.bannerH, titleF, dateF, dates };
}
// Remap the whole theme to a laser-friendly grayscale (light ground, dark ink).
const LASER_COLORS = {
  '#06141f':'#ffffff', '#0b2436':'#ffffff', '#050e18':'#ffffff',
  'rgba(8,22,33,0.88)':'#ffffff', 'rgba(6,18,28,0.86)':'#ffffff', 'rgba(6,18,28,0.82)':'#ffffff', 'rgba(7,16,32,0.88)':'#ffffff',
  '#27412f':'#d2d2d2', '#3a6048':'#9a9a9a',
  '#e8c96b':'#000000', '#d4ae50':'#000000', '#c8a84b':'#000000', '#b98d3e':'#000000', '#6e5526':'#000000',
  '#f0d27a':'#000000', '#d8b85a':'#000000', '#f0d68a':'#000000', '#f3ead0':'#000000', '#d6c290':'#000000',
  '#ede6d2':'#000000', '#cdbf9e':'#000000',
  '#8a6d2a':'#555555', '#a8801f':'#333333', '#2a2110':'#000000',
  '#c14b39':'#1a1a1a', '#8f3024':'#000000',
  '#5aa0e0':'#444444', '#a8d4ff':'#666666',
  'rgba(150,190,170,0.07)':'#eeeeee', 'rgba(0,0,0,0.45)':'#cccccc',
};
function toLaserColors(str) {
  for (const [from, to] of Object.entries(LASER_COLORS)) str = str.split(from).join(to);
  return str;
}

function buildRouteAndMarkers(overlay, projection, itin, L, opts) {
  const laser = !!(opts && opts.laser), buffers = (opts && opts.buffers) || [];
  const all = itin.waypoints;
  const ports = dedupe(all.filter(w => w.type !== 'sea'));
  const lineGen = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveCatmullRom.alpha(0.5));
  let positionRoute;
  if (laser) {
    // Real dash geometry (laser ignores stroke-dasharray), with dashes inside
    // the chrome buffers omitted so the route never crosses those zones.
    const d = lineGen(all.map(w => projection([w.lon, w.lat])));
    const dg = overlay.append('g').attr('class', 'route-dashes');
    for (const seg of routeToDashes(d, L.routeW*3.4, L.routeW*2.6, buffers))
      dg.append('path').attr('class', 'route').attr('d', seg).attr('stroke-width', L.routeW).attr('stroke-linecap', 'round');
    positionRoute = () => {};
  } else {
    const dash = `${(L.routeW*3.4).toFixed(1)} ${(L.routeW*2.6).toFixed(1)}`;
    const rShadow = overlay.append('path').attr('class', 'route-shadow').attr('stroke-width', L.routeW*1.8).attr('stroke-dasharray', dash);
    const rLine = overlay.append('path').attr('class', 'route').attr('stroke-width', L.routeW).attr('stroke-dasharray', dash).attr('filter', 'url(#glow)');
    positionRoute = function (t) {
      const pts = all.map(w => t.apply(projection([w.lon, w.lat])));
      const d = lineGen(pts); rShadow.attr('d', d); rLine.attr('d', d);
    };
  }
  // Choose a label side per port; flip neighbours whose (wide) labels would
  // overlap to the opposite side (e.g. Miami/CocoCay, St Thomas/St Maarten).
  const mpts = ports.map(w => projection([w.lon, w.lat]));
  const wEst = ports.map(w => w.name.length * L.labelF * 0.55); // approx label width
  const sides = mpts.map(p => (p[1] < L.map.h*0.18) ? 1 : -1);
  for (let i = 0; i < mpts.length; i++)
    for (let k = 0; k < i; k++) {
      const dx = Math.abs(mpts[i][0]-mpts[k][0]), dy = Math.abs(mpts[i][1]-mpts[k][1]);
      if (sides[i] === sides[k] && dx < (wEst[i]+wEst[k])/2 && dy < L.labelF*1.6)
        sides[i] = -sides[k];
    }
  const mSel = overlay.selectAll('g.marker').data(ports).enter().append('g').attr('class', 'marker');
  mSel.each(function (w, i) {
    const s = d3.select(this), home = w.type === 'home', scn = w.type === 'scenic';
    const rr = home ? L.markerR*1.3 : scn ? L.markerR*1.15 : L.markerR;
    if (home) s.append('circle').attr('class', 'port-ring').attr('r', rr + L.markerR).attr('stroke-width', 1.2);
    s.append('circle').attr('class', scn ? 'port-dot-scenic' : home ? 'port-dot-home' : 'port-dot').attr('r', rr).attr('stroke-width', 1.4);
    const off = sides[i] > 0 ? (L.labelF + 8) : -(L.labelF*0.6 + 5);
    s.append('text').attr('class', `lbl${home ? ' lbl-home' : scn ? ' lbl-scenic' : ''}`)
      .attr('x', 0).attr('y', off).attr('font-size', home ? L.labelF*1.05 : L.labelF).text(w.name);
  });
  function positionMarkers(t) {
    mSel.attr('transform', w => { const p = t.apply(projection([w.lon, w.lat])); return `translate(${p[0]},${p[1]})`; });
  }
  return { positionRoute, positionMarkers };
}

// ════════════════════════════════════════════════════════════════════════════
//  LAYOUT + COMPOSE  (used by both screen render and sized exports)
// ════════════════════════════════════════════════════════════════════════════

function computeLayout(W, H, shape) {
  const S = Math.min(W, H);
  const L = { shape, W, H, cx: W/2 };
  L.wheelR       = shape === 'rect' ? 38 : S*0.072;
  L.handleR      = L.wheelR * 1.34;            // outer reach of the wheel's handle knobs
  L.shipF        = shape === 'rect' ? 22 : S/27;
  L.bannerH      = shape === 'rect' ? 46 : S*0.082;
  L.bannerTitleF = shape === 'rect' ? 15 : S/42;
  L.bannerDateF  = L.bannerTitleF*0.82;
  L.routeW       = Math.max(2, S/240);
  L.markerR      = Math.max(3.4, S/175);
  L.labelF       = Math.max(9, S/66);

  if (shape === 'circle') {
    const ring = 26;
    L.ring = ring; L.cy = H/2; L.R = W/2 - ring;
    const top = L.cy - L.R;
    L.wheelCY   = top + 16 + L.handleR;
    L.shipY     = L.wheelCY + L.handleR + L.shipF*1.05;
    L.bannerTop = L.shipY + 18;
    const headerBottom = L.bannerTop + L.bannerH + 12;
    const yTop = headerBottom, yBot = L.cy + L.R - 96;
    const hw = Math.min(Math.sqrt(Math.max(0, L.R*L.R-(yTop-L.cy)**2)), Math.sqrt(Math.max(0, L.R*L.R-(yBot-L.cy)**2))) - 12;
    L.map = { x: L.cx - hw, y: yTop, w: hw*2, h: yBot - yTop };
    L.interior = { x: L.cx - L.R + 2, y: L.cy - L.R + 2, w: 2*(L.R-2), h: 2*(L.R-2) };
    L.compass = { cx: L.cx, cy: L.cy + L.R - 50, r: 32 };
    L.bannerMaxW = 2 * Math.sqrt(Math.max(0, L.R*L.R - (L.bannerTop - L.cy)**2)) - 34;
    L.showLegend = false;
  } else {
    const m = shape === 'square' ? 22 : 14, edge = 8, innerPad = 12, topGap = 16;
    L.m = m;
    L.interior = { x: m + edge, y: m + edge, w: W - 2*(m+edge), h: H - 2*(m+edge) };
    L.wheelCY   = m + topGap + L.handleR;
    L.shipY     = L.wheelCY + L.handleR + L.shipF*1.05;
    L.bannerTop = L.shipY + 18;
    const mapTop = L.bannerTop + L.bannerH + 14;
    L.map = { x: m + innerPad, y: mapTop, w: W - 2*(m+innerPad), h: H - mapTop - (m+innerPad) };
    const cr = shape === 'square' ? 40 : 34, co = cr + 10;
    L.compass = { cx: L.map.x + L.map.w - co, cy: L.map.y + L.map.h - co, r: cr };
    L.bannerMaxW = L.interior.w - 40;
    L.showLegend = true;
  }
  return L;
}

// Build the full chart into svgSel. Returns the layout. Wires zoom if interactive.
function composeChart(svgSel, opts) {
  const { W, H, shape, itin, startDate, endDate, fitMode, interactive, cropToView, laser } = opts;
  svgSel.attr('viewBox', `0 0 ${W} ${H}`).attr('preserveAspectRatio', 'xMidYMid meet').attr('xmlns', 'http://www.w3.org/2000/svg');
  svgSel.selectAll('*').remove();
  const L = computeLayout(W, H, shape);

  const defs = svgSel.append('defs');
  const glow = defs.append('filter').attr('id', 'glow').attr('x', '-30%').attr('y', '-30%').attr('width', '160%').attr('height', '160%');
  glow.append('feGaussianBlur').attr('stdDeviation', L.routeW*0.7).attr('result', 'b');
  const fm = glow.append('feMerge'); fm.append('feMergeNode').attr('in', 'b'); fm.append('feMergeNode').attr('in', 'SourceGraphic');

  // The map fills the whole interior (behind the header too) so there's no blank
  // box at the top; the route itself is still fit to the area below the header.
  const clip = defs.append('clipPath').attr('id', 'mapClip');
  if (shape === 'circle') clip.append('circle').attr('cx', L.cx).attr('cy', L.cy).attr('r', L.R - 2);
  else clip.append('rect').attr('x', L.interior.x).attr('y', L.interior.y).attr('width', L.interior.w).attr('height', L.interior.h).attr('rx', 5);

  svgSel.append('rect').attr('class', 'chart-bg').attr('width', W).attr('height', H);
  if (shape === 'circle') svgSel.append('circle').attr('class', 'water').attr('cx', L.cx).attr('cy', L.cy).attr('r', L.R - 2);
  else svgSel.append('rect').attr('class', 'water').attr('x', L.interior.x).attr('y', L.interior.y).attr('width', L.interior.w).attr('height', L.interior.h).attr('rx', 5);

  // Clipped map layer
  const mapWrap = svgSel.append('g').attr('clip-path', 'url(#mapClip)');
  const gArea = mapWrap.append('g').attr('transform', `translate(${L.map.x},${L.map.y})`);
  gArea.append('rect').attr('class', 'zoom-catch')
    .attr('x', L.interior.x - L.map.x).attr('y', L.interior.y - L.map.y)
    .attr('width', L.interior.w).attr('height', L.interior.h).attr('fill', 'transparent');
  const gGeo = gArea.append('g').attr('class', 'geo');
  const overlay = gArea.append('g').attr('class', 'overlay');

  const projection = makeProjection(itin.waypoints, { w: L.map.w, h: L.map.h }, fitMode, itin.region);
  // For exports, physically crop the geography to the visible area so the file
  // contains only the local map (laser software ignores SVG clip-paths).
  if (cropToView) {
    const ix = L.interior.x - L.map.x, iy = L.interior.y - L.map.y;
    projection.clipExtent([[ix, iy], [ix + L.interior.w, iy + L.interior.h]]);
  }
  const path = d3.geoPath().projection(projection);

  // Decide compass + legend placement up front (rect/square) so we know where to
  // clear map-free buffers for the laser export.
  if (shape !== 'circle') {
    const ports = dedupe(itin.waypoints.filter(w => w.type !== 'sea'));
    const pp = ports.map(w => { const q = projection([w.lon, w.lat]); return [L.map.x + q[0], L.map.y + q[1]]; });
    const minD = (cx, cy) => pp.length ? Math.min(...pp.map(p => Math.hypot(p[0]-cx, p[1]-cy))) : 1e9;
    const ci = L.compass.r + 12;
    const bl = [L.map.x + ci, L.map.y + L.map.h - ci], br = [L.map.x + L.map.w - ci, L.map.y + L.map.h - ci];
    const compassBR = minD(br[0], br[1]) >= minD(bl[0], bl[1]);
    L.compass.cx = (compassBR ? br : bl)[0];
    L.compass.cy = (compassBR ? br : bl)[1];
    const cands = ['TL', 'TR', compassBR ? 'BL' : 'BR'];
    const probe = { TL:[L.map.x+50, L.map.y+45], TR:[L.map.x+L.map.w-50, L.map.y+45],
                    BL:[L.map.x+50, L.map.y+L.map.h-45], BR:[L.map.x+L.map.w-50, L.map.y+L.map.h-45] };
    let best = cands[0], bestD = -1;
    for (const c of cands) { const d = minD(probe[c][0], probe[c][1]); if (d > bestD) { bestD = d; best = c; } }
    L.legendCorner = best;
  }

  // Buffer rectangles (map-free zones) around the chrome, in map-local coords.
  const bb = bannerBox(L, itin, startDate, endDate);
  const buffers = [];
  if (laser) {
    const pad = 7, toLocal = r => ({ x0: r.x0 - L.map.x, y0: r.y0 - L.map.y, x1: r.x1 - L.map.x, y1: r.y1 - L.map.y });
    const emHalf = Math.max(L.handleR, bb.w/2, itin.ship.length * L.shipF * 0.31) + pad;
    buffers.push(toLocal({ x0: L.cx - emHalf, y0: L.wheelCY - L.handleR - pad, x1: L.cx + emHalf, y1: bb.y + bb.h + pad }));
    const ch = L.compass.r + Math.max(8, L.compass.r*0.34) + pad;
    buffers.push(toLocal({ x0: L.compass.cx - ch, y0: L.compass.cy - ch, x1: L.compass.cx + ch, y1: L.compass.cy + ch }));
    if (L.showLegend) {
      const lw = 122, lh = 80;
      const lx = (L.legendCorner[1] === 'R') ? (L.map.x + L.map.w - lw - 10) : (L.map.x + 10);
      const ly = (L.legendCorner[0] === 'T') ? (L.map.y + 8) : (L.map.y + L.map.h - lh - 6);
      buffers.push(toLocal({ x0: lx - pad, y0: ly - pad, x1: lx + lw + pad, y1: ly + lh + pad }));
    }
  }

  drawGeography(gGeo, projection, path, laser);
  if (cropToView && shape === 'circle') {
    const ccx = L.cx - L.map.x, ccy = L.cy - L.map.y, cr = L.R - 2;
    gGeo.selectAll('.land, .borders').each(function () { const s = d3.select(this); s.attr('d', clipPathToCircle(s.attr('d') || '', ccx, ccy, cr, true)); });
    gGeo.select('.graticule').each(function () { const s = d3.select(this); s.attr('d', clipPathToCircle(s.attr('d') || '', ccx, ccy, cr, false)); });
  }
  if (laser && buffers.length) {
    gGeo.select('.land').each(function () { const s = d3.select(this); s.attr('d', subtractRects(s.attr('d') || '', buffers)); });
  }

  const rm = buildRouteAndMarkers(overlay, projection, itin, L, { laser, buffers });
  rm.positionRoute(d3.zoomIdentity);
  rm.positionMarkers(d3.zoomIdentity);

  // Header chrome: captain's wheel, ship name, itinerary banner.
  const head = svgSel.append('g').attr('class', 'header');
  drawShipsWheel(head, L.cx, L.wheelCY, L.wheelR);
  head.append('text').attr('class', 'ship-name').attr('x', L.cx).attr('y', L.shipY).attr('font-size', L.shipF).text(itin.ship);
  const dvy = L.shipY + (L.bannerTop - L.shipY) * 0.5;
  const dvw = Math.min(L.bannerMaxW * 0.55, 150);
  head.append('line').attr('x1', L.cx - dvw/2).attr('y1', dvy).attr('x2', L.cx - 9).attr('y2', dvy).attr('stroke', '#b98d3e').attr('stroke-width', 1);
  head.append('line').attr('x1', L.cx + 9).attr('y1', dvy).attr('x2', L.cx + dvw/2).attr('y2', dvy).attr('stroke', '#b98d3e').attr('stroke-width', 1);
  drawStar(head, L.cx, dvy, 4);
  drawBanner(head, L.cx, L.bannerTop, L.bannerMaxW, itin, startDate, endDate, L);

  drawFrame(svgSel, L);
  drawCompassRose(svgSel.append('g'), L.compass.cx, L.compass.cy, L.compass.r, Math.max(8, L.compass.r*0.34));
  drawLegend(svgSel, L);

  if (interactive) {
    zoomBehavior = d3.zoom().scaleExtent([1, 40]).extent([[0,0],[L.map.w, L.map.h]])
      .on('zoom', (e) => { gGeo.attr('transform', e.transform); rm.positionRoute(e.transform); rm.positionMarkers(e.transform); });
    zoomTarget = gArea;
    gArea.call(zoomBehavior);
    gArea.call(zoomBehavior.transform, d3.zoomIdentity);
  }
  return L;
}

function renderScreen(itin, startDate, endDate) {
  const container = svgEl.parentElement;
  composeChart(d3.select('#cruise-map'), {
    W: container.clientWidth, H: container.clientHeight,
    shape: 'rect', itin, startDate, endDate, fitMode: 'region', interactive: true,
  });
}

// ─── Zoom controls ──────────────────────────────────────────────────────────────
document.getElementById('zoom-in').addEventListener('click', () => { if (zoomTarget) zoomTarget.transition().duration(280).call(zoomBehavior.scaleBy, 1.6); });
document.getElementById('zoom-out').addEventListener('click', () => { if (zoomTarget) zoomTarget.transition().duration(280).call(zoomBehavior.scaleBy, 0.625); });
document.getElementById('zoom-reset').addEventListener('click', () => { if (zoomTarget) zoomTarget.transition().duration(350).call(zoomBehavior.transform, d3.zoomIdentity); });

// ════════════════════════════════════════════════════════════════════════════
//  EXPORT
// ════════════════════════════════════════════════════════════════════════════

function styleAndSerialize(node, laser) {
  // Ensure exactly one <style> source inside <defs> (never a duplicate attribute).
  node.querySelectorAll('style').forEach(s => s.remove());
  node.removeAttribute('style');
  const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  styleEl.textContent = FONT_IMPORT + MAP_CSS;
  let defs = node.querySelector('defs');
  if (!defs) { defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs'); node.insertBefore(defs, node.firstChild); }
  defs.appendChild(styleEl);
  let str = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(node);
  if (laser) str = toLaserColors(str);   // remap the theme to laser-friendly grayscale
  return str;
}

// "Wide" export: the current on-screen chart, preserving the live zoom/pan.
// All exports are built fresh and have their geography geometry physically
// cropped to the visible area (cropToView), so the file only contains the local
// cruise-route map — never the whole world — for laser/engraving software that
// ignores SVG clip-paths.
function buildExport(shape) {
  const itin = ITINERARIES[itinSelect.value];
  if (!itin) return null;
  let W, H, win, hin, sh, fit;
  if (shape === 'square')      { W = H = 700; win = hin = '3.5in'; sh = 'square'; fit = 'route'; }
  else if (shape === 'circle') { W = H = 760; win = hin = '3.8in'; sh = 'circle'; fit = 'route'; }
  else { const c = svgEl.parentElement; W = c.clientWidth || 960; H = c.clientHeight || 640; sh = 'rect'; fit = 'region'; }
  const svg = d3.create('svg');
  if (win) svg.attr('width', win).attr('height', hin);
  composeChart(svg, { W, H, shape: sh, itin, startDate: dateStart.value, endDate: dateEnd.value, fitMode: fit, interactive: false, cropToView: true, laser: true });
  return svg.node();
}

exportBtn.addEventListener('click', () => {
  const shape = exportFormat.value;
  const node = buildExport(shape);
  if (!node) return;
  const str = styleAndSerialize(node, true);
  const blob = new Blob([str], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const itin = ITINERARIES[itinSelect.value];
  const tag = shape === 'square' ? '3.5in_square' : shape === 'circle' ? '3.8in_circle' : 'wide';
  a.download = `RC_${itin.name.replace(/[^a-zA-Z0-9]+/g,'_')}_${itin.ship.replace(/[^a-zA-Z0-9]+/g,'_')}_${tag}.svg`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ─── Helpers ──────────────────────────────────────────────────────────────────
function formatDate(s) {
  if (!s) return '';
  return new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
</script>
