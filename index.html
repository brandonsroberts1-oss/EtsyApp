<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Caribbean Cruise Route Mapper</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --navy: #0a1628;
      --ocean: #1a3a5c;
      --blue: #1e6fa8;
      --gold: #c8a84b;
      --gold-light: #e8c96b;
      --white: #f0ede6;
      --gray: #8a9bb0;
      --panel: #0d1f36;
      --border: #1e3a5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #071020 0%, #122040 100%);
      border-bottom: 2px solid var(--gold);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    header .anchor { font-size: 1.9rem; line-height: 1; }
    header h1 { font-size: 1.3rem; letter-spacing: 0.07em; color: var(--gold-light); }
    header p  { font-size: 0.72rem; color: var(--gray); font-family: Arial,sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }

    .app {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      min-height: 0;
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-title {
      font-size: 0.65rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      font-size: 0.74rem;
      color: var(--gray);
      margin-bottom: 4px;
      font-family: Arial, sans-serif;
      letter-spacing: 0.04em;
    }

    select, input[type="date"] {
      width: 100%;
      padding: 8px 10px;
      background: #071020;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--white);
      font-size: 0.84rem;
      font-family: Arial, sans-serif;
      transition: border-color 0.2s;
    }
    select:focus, input:focus { outline: none; border-color: var(--gold); }
    select option { background: #071020; }

    .form-group { margin-bottom: 11px; }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 3px;
      font-size: 0.82rem;
      font-family: Arial, sans-serif;
      cursor: pointer;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #b8942a 0%, var(--gold-light) 100%);
      color: #07100a;
      font-weight: bold;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      margin-top: 7px;
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(200,168,75,0.1); }
    .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }

    /* ── Itinerary preview ───────────────────────────────────── */
    .itin-preview {
      background: #071020;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 11px;
      min-height: 60px;
    }
    .itin-meta {
      font-size: 0.7rem;
      color: var(--gray);
      font-family: Arial, sans-serif;
      margin-bottom: 8px;
    }
    .itin-meta span { color: var(--gold-light); }

    .port-list { list-style: none; }
    .port-list li {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      padding: 4px 0;
      font-size: 0.78rem;
      font-family: Arial, sans-serif;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      line-height: 1.3;
    }
    .port-list li:last-child { border-bottom: none; }
    .pday {
      font-size: 0.66rem;
      color: var(--gray);
      min-width: 28px;
      flex-shrink: 0;
      padding-top: 1px;
    }
    .pdot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
    }
    .pdot-home   { background: var(--gold-light); }
    .pdot-port   { background: var(--gold); }
    .pdot-scenic { background: #4a90d9; }
    .pdot-sea    { background: #2a3a4a; border: 1px solid #3a5a7a; }

    /* ── Map area ────────────────────────────────────────────── */
    .map-area {
      position: relative;
      background: #050e18;
      overflow: hidden;
    }

    #cruise-map { width: 100%; height: 100%; display: block; cursor: grab; }
    #cruise-map:active { cursor: grabbing; }

    .zoom-controls {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .zoom-btn {
      width: 32px; height: 32px;
      background: rgba(7,16,32,0.88);
      border: 1px solid var(--border);
      color: var(--gold);
      font-size: 1.1rem;
      border-radius: 3px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .zoom-btn:hover { background: rgba(30,58,92,0.9); }

    .zoom-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-family: Arial, sans-serif;
      font-size: 0.68rem;
      color: rgba(138,155,176,0.7);
      pointer-events: none;
      white-space: nowrap;
    }

    .placeholder-msg {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      text-align: center;
      color: var(--gray);
      font-family: Arial, sans-serif;
      pointer-events: none;
    }
    .placeholder-msg .icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.5; }
    .placeholder-msg p { font-size: 0.85rem; line-height: 1.7; }

    /* ── SVG map internals ───────────────────────────────────── */
    /* vector-effect keeps coastlines/grid a constant on-screen width as the
       geography layer is scaled up on zoom, so they stay crisp (not blocky). */
    .ocean-bg  { fill: #061220; }
    .land      { fill: #233c2d; stroke: #2e5c3a; stroke-width: 0.6; vector-effect: non-scaling-stroke; }
    .borders   { fill: none; stroke: #3a5e45; stroke-width: 0.5; vector-effect: non-scaling-stroke; }
    .graticule { fill: none; stroke: rgba(255,255,255,0.04); stroke-width: 0.5; vector-effect: non-scaling-stroke; }

    .route-line-shadow {
      fill: none;
      stroke: rgba(0,0,0,0.5);
      stroke-width: 4.5;
      stroke-dasharray: 9 7;
      stroke-linecap: round;
    }
    .route-line {
      fill: none;
      stroke: #d4ae50;
      stroke-width: 2.5;
      stroke-dasharray: 9 7;
      stroke-linecap: round;
    }
    .port-ring {
      fill: none;
      stroke: #e8c96b;
      stroke-width: 1.2;
      stroke-dasharray: 3 2;
      opacity: 0.6;
    }
    .port-circle {
      fill: #c8a84b;
      stroke: #e8d080;
      stroke-width: 1.5;
    }
    .port-circle-home {
      fill: #e8c96b;
      stroke: #ffffff;
      stroke-width: 1.8;
    }
    .port-circle-scenic {
      fill: #4a90d9;
      stroke: #80c0ff;
      stroke-width: 1.5;
    }
    .port-label-bg { fill: rgba(5,14,24,0.82); rx: 2; }
    .port-label {
      font-family: Arial, sans-serif;
      font-size: 10.5px;
      fill: #eee;
      text-anchor: middle;
      pointer-events: none;
    }
    .port-label-home { fill: #e8c96b; font-weight: bold; font-size: 11px; }
    .port-label-scenic { fill: #80c0ff; font-size: 10px; }
    .map-title {
      font-family: Georgia, serif;
      font-size: 15px;
      fill: #e8c96b;
      text-anchor: middle;
    }
    .map-subtitle {
      font-family: Arial, sans-serif;
      font-size: 10.5px;
      fill: #8a9bb0;
      text-anchor: middle;
    }
    .legend { font-family: Arial, sans-serif; font-size: 10px; fill: #8a9bb0; }
    .legend-title { fill: #c8a84b; font-size: 10.5px; }
  </style>
</head>
<body>

<header>
  <span class="anchor">&#9875;</span>
  <div>

</header>

            <option value="ovation_north">Alaska Northbound — 7 Night</option>
            <option value="ovation_south">Alaska Southbound — 7 Night</option>
          </optgroup>
          <optgroup label="Alaska — Serenade of the Seas (Vancouver)">

          </optgroup>
          <optgroup label="Bermuda — Odyssey of the Seas (Cape Liberty, NJ)">

      </div>

      <div class="form-group date-row">
        <div>
          <label for="date-start">Departure</label>
          <input type="date" id="date-start" />
        </div>
        <div>
          <label for="date-end">Return</label>
          <input type="date" id="date-end" />
        </div>
      </div>
    </div>

    <div>
      <div class="section-title">Itinerary Preview</div>
      <div class="itin-preview" id="itin-preview">
        <p style="color:var(--gray);font-size:0.78rem;font-family:Arial,sans-serif;">
          Select an itinerary to preview ports of call.
        </p>
      </div>
    </div>

    <div>
      <button class="btn btn-primary" id="generate-btn">&#9654; Generate Route Map</button>
      <button class="btn btn-secondary" id="export-btn" disabled>&#8595; Export as SVG</button>
    </div>

  </aside>

  <main class="map-area">
    <div class="placeholder-msg" id="placeholder">
      <div class="icon">&#9875;</div>
      <p>Select a Royal Caribbean itinerary<br>and click <strong>Generate Route Map</strong>.</p>
    </div>

    <svg id="cruise-map"></svg>

    <div class="zoom-controls" id="zoom-controls" style="display:none;">
      <button class="zoom-btn" id="zoom-in"  title="Zoom in">+</button>
      <button class="zoom-btn" id="zoom-out" title="Zoom out">−</button>
      <button class="zoom-btn" id="zoom-reset" title="Reset view" style="font-size:0.7rem;">&#8635;</button>
    </div>

    <div class="zoom-hint" id="zoom-hint" style="display:none;">
      Scroll to zoom &bull; Drag to pan
    </div>
  </main>
</div>

const REGION_BOUNDS = {
  Caribbean:       { lon0: -92,  lat0:  9,  lon1: -58,  lat1: 32 },
  Caribbean_South: { lon0: -70,  lat0:  9,  lon1: -55,  lat1: 22 },
  Mediterranean:   { lon0:  -6,  lat0: 29,  lon1: 32,   lat1: 48 },

  Atlantic:        { lon0: -78,  lat0: 29,  lon1: -60,   lat1: 44 },

// ─── State ────────────────────────────────────────────────────────────────────
let worldData = null;
let zoomBehavior = null;
let zoomTarget = null;
let currentKey = null;

// ─── UI refs ──────────────────────────────────────────────────────────────────
const itinSelect   = document.getElementById('itin-select');
const dateStart    = document.getElementById('date-start');
const dateEnd      = document.getElementById('date-end');
const generateBtn  = document.getElementById('generate-btn');
const exportBtn    = document.getElementById('export-btn');
const previewEl    = document.getElementById('itin-preview');
const placeholder  = document.getElementById('placeholder');
const svgEl        = document.getElementById('cruise-map');
const zoomControls = document.getElementById('zoom-controls');
const zoomHint     = document.getElementById('zoom-hint');

// ─── Pre-load world data ──────────────────────────────────────────────────────
async function loadWorld() {
  // 50m resolution gives far more coastline detail (and reveals small Caribbean
  // islands) than 110m, so zooming in actually shows more detail. Fall back to
  // 110m if the larger file fails to load.
  const sources = [
    'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json',
    'https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json',
  ];
  for (const url of sources) {
    try {
      const res = await fetch(url);
      if (res.ok) { worldData = await res.json(); return; }
    } catch (e) { /* try next source */ }
  }
}
loadWorld();

// ─── Itinerary select handler ─────────────────────────────────────────────────
itinSelect.addEventListener('change', () => {
  const key = itinSelect.value;
  currentKey = key || null;
  if (!key) {
    previewEl.innerHTML = '<p style="color:var(--gray);font-size:0.78rem;font-family:Arial,sans-serif;">Select an itinerary to preview ports of call.</p>';
    return;
  }
  const itin = ITINERARIES[key];

  // Auto-fill dates
  if (!dateStart.value) {
    const d = new Date(); d.setDate(d.getDate() + 30);
    dateStart.value = d.toISOString().split('T')[0];
  }
  if (dateStart.value) {
    const d = new Date(dateStart.value + 'T00:00:00');
    d.setDate(d.getDate() + itin.nights);
    dateEnd.value = d.toISOString().split('T')[0];
  }

  // Render preview
  const visibleWaypoints = itin.waypoints.filter(w => w.type !== 'sea');
  previewEl.innerHTML = `
    <div class="itin-meta">
      <span>${itin.ship}</span> &bull; ${itin.nights} nights &bull; from ${itin.homePort}
    </div>
    <ul class="port-list">
      ${visibleWaypoints.map(w => `
        <li>
          <span class="pday">Day ${w.day}</span>
          <div class="pdot pdot-${w.type === 'home' ? 'home' : w.type === 'scenic' ? 'scenic' : 'port'}"></div>
          <span>${w.name}</span>
        </li>
      `).join('')}
    </ul>
  `;
});

// ─── Date sync ───────────────────────────────────────────────────────────────
dateStart.addEventListener('change', () => {
  const key = itinSelect.value;
  if (!key || !dateStart.value) return;
  const itin = ITINERARIES[key];
  const d = new Date(dateStart.value + 'T00:00:00');
  d.setDate(d.getDate() + itin.nights);
  dateEnd.value = d.toISOString().split('T')[0];
});

// ─── Generate map ─────────────────────────────────────────────────────────────
generateBtn.addEventListener('click', async () => {
  const key = itinSelect.value;
  if (!key) { alert('Please select an itinerary.'); return; }
  if (!worldData) {
    generateBtn.textContent = 'Loading…';
    await loadWorld();
  }
  generateBtn.textContent = '⏳ Rendering…';
  await new Promise(r => setTimeout(r, 10));
  renderMap(ITINERARIES[key], dateStart.value, dateEnd.value);
  generateBtn.textContent = '▶ Generate Route Map';
  exportBtn.disabled = false;
  placeholder.style.display = 'none';
  zoomControls.style.display = 'flex';
  zoomHint.style.display = 'block';
});

// ─── Render ───────────────────────────────────────────────────────────────────
function renderMap(itin, startDate, endDate) {
  const container = svgEl.parentElement;
  const W = container.clientWidth;
  const H = container.clientHeight;

  const svg = d3.select('#cruise-map')
    .attr('width', W)
    .attr('height', H)
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('xmlns', 'http://www.w3.org/2000/svg');

  svg.selectAll('*').remove();

  // ── Layout ──────────────────────────────────────────────────
  const padT = 52, padB = 52, padL = 16, padR = 16;
  const mapW = W - padL - padR;
  const mapH = H - padT - padB;

  // ── Defs: glow filter + clip path ───────────────────────────
  const defs = svg.append('defs');
  const glow = defs.append('filter').attr('id', 'glow').attr('x', '-30%').attr('y', '-30%').attr('width', '160%').attr('height', '160%');
  glow.append('feGaussianBlur').attr('stdDeviation', '2').attr('result', 'blur');
  const feMerge = glow.append('feMerge');
  feMerge.append('feMergeNode').attr('in', 'blur');
  feMerge.append('feMergeNode').attr('in', 'SourceGraphic');
  // Clip geography + route to the map frame so zoomed/panned content never
  // spills over the title, legend or compass (and exports cleanly).
  defs.append('clipPath').attr('id', 'mapClip')
    .append('rect').attr('x', 0).attr('y', 0).attr('width', mapW).attr('height', mapH).attr('rx', 4);

  // Full-frame background (guarantees a filled backdrop in the exported SVG)
  svg.append('rect').attr('width', W).attr('height', H).attr('class', 'svg-bg').attr('fill', '#061220');

  // ── Projection (fit region to the frame) ────────────────────
  const allWpts = itin.waypoints;
  const visiblePorts = allWpts.filter(w => w.type !== 'sea');
  const lons = allWpts.map(w => w.lon);
  const lats = allWpts.map(w => w.lat);
  let lon0 = Math.min(...lons), lon1 = Math.max(...lons);
  let lat0 = Math.min(...lats), lat1 = Math.max(...lats);
  const lonSpan = lon1 - lon0 || 10;
  const latSpan = lat1 - lat0 || 8;
  lon0 -= lonSpan * 0.28; lon1 += lonSpan * 0.28;
  lat0 -= latSpan * 0.28; lat1 += latSpan * 0.28;
  const bounds = REGION_BOUNDS[itin.region];
  if (bounds) {
    lon0 = Math.min(lon0, bounds.lon0); lon1 = Math.max(lon1, bounds.lon1);
    lat0 = Math.min(lat0, bounds.lat0); lat1 = Math.max(lat1, bounds.lat1);
  }
  // Fit to the region by its corner POINTS (a MultiPoint), not a Polygon: a
  // spherical polygon's ring winding can make d3 fit the whole globe instead of
  // the small region (which would render the entire world map zoomed out).
  const fitGeoJSON = { type: 'MultiPoint', coordinates: [[lon0,lat0],[lon1,lat0],[lon1,lat1],[lon0,lat1]] };
  const projection = d3.geoMercator().fitSize([mapW, mapH], fitGeoJSON);
  const path = d3.geoPath().projection(projection);

  // ── Layer structure ─────────────────────────────────────────
  //  mapRoot (translate by pad)   ← zoom behaviour is attached here
  //    ocean-bg               (static frame backdrop)
  //    clipWrap               (clipped to the map frame)
  //      gGeo                 (gets the zoom transform → geography scales)
  //      overlay              (route + markers; kept at constant on-screen size)
  //    chrome                 (static compass + legend, never scaled)
  const mapRoot = svg.append('g').attr('class', 'map-root').attr('transform', `translate(${padL},${padT})`);
  mapRoot.append('rect').attr('class', 'ocean-bg').attr('width', mapW).attr('height', mapH).attr('rx', 4);

  const clipWrap = mapRoot.append('g').attr('clip-path', 'url(#mapClip)');
  const gGeo = clipWrap.append('g').attr('class', 'geo');
  const overlay = clipWrap.append('g').attr('class', 'overlay');

  // Geography (scales with zoom; strokes stay constant via non-scaling-stroke)
  const graticule = d3.geoGraticule().step([10, 10]);
  gGeo.append('path').datum(graticule()).attr('class', 'graticule').attr('d', path);
  gGeo.append('path').datum(topojson.feature(worldData, worldData.objects.countries)).attr('class', 'land').attr('d', path);
  gGeo.append('path').datum(topojson.mesh(worldData, worldData.objects.countries, (a,b) => a !== b)).attr('class', 'borders').attr('d', path);

  // ── Route (lives in the overlay so its width / dash / glow stay constant
  //    regardless of zoom; only its geometry is recomputed per zoom) ──────────
  const lineGen = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveCatmullRom.alpha(0.5));
  const routeShadow = overlay.append('path').attr('class', 'route-line-shadow');
  const routeLine   = overlay.append('path').attr('class', 'route-line').attr('filter', 'url(#glow)');

  function positionRoute(t) {
    const pts = allWpts.map(w => t.apply(projection([w.lon, w.lat])));
    const d = lineGen(pts);
    routeShadow.attr('d', d);
    routeLine.attr('d', d);
  }

  // ── Port markers (constant on-screen size; only the group moves on zoom) ──
  const seen = new Set();
  const deduped = visiblePorts.filter(w => { if (seen.has(w.name)) return false; seen.add(w.name); return true; });

  const markerSel = overlay.selectAll('g.marker').data(deduped).enter().append('g').attr('class', 'marker');
  markerSel.each(function (w) {
    const sel = d3.select(this);
    const isHome = w.type === 'home', isScenic = w.type === 'scenic';
    const r = isHome ? 6 : isScenic ? 5 : 4.5;
    if (isHome) sel.append('circle').attr('class', 'port-ring').attr('r', 10);
    sel.append('circle')
      .attr('class', isScenic ? 'port-circle-scenic' : isHome ? 'port-circle-home' : 'port-circle')
      .attr('r', r);
    const lblW = Math.min(w.name.length * 5.8 + 8, 220);
    const y0 = projection([w.lon, w.lat])[1];
    const offY = (y0 < mapH * 0.18) ? 19 : -13;   // drop the label below if near the top edge
    sel.append('rect').attr('class', 'port-label-bg')
      .attr('x', -lblW/2).attr('y', offY - 10).attr('width', lblW).attr('height', 13).attr('rx', 2);
    sel.append('text')
      .attr('class', `port-label${isHome ? ' port-label-home' : isScenic ? ' port-label-scenic' : ''}`)
      .attr('x', 0).attr('y', offY).text(w.name);
  });

  function positionMarkers(t) {
    markerSel.attr('transform', w => { const p = t.apply(projection([w.lon, w.lat])); return `translate(${p[0]},${p[1]})`; });
  }

  // ── Zoom: geography scales for detail, annotations stay readable ──────────
  zoomBehavior = d3.zoom()
    .scaleExtent([1, 40])
    .extent([[0, 0], [mapW, mapH]])
    .on('zoom', (event) => {
      const t = event.transform;
      gGeo.attr('transform', t);   // scales land/coastlines → reveals detail
      positionRoute(t);            // route follows, but keeps constant width
      positionMarkers(t);          // markers + labels follow, but stay same size
    });
  zoomTarget = mapRoot;
  mapRoot.call(zoomBehavior);

  // ── Chrome: compass + legend (static, never scaled) ──────────
  const chrome = mapRoot.append('g').attr('class', 'chrome');
  drawCompass(chrome, mapW - 46, mapH - 46, 28);

  const leg = chrome.append('g').attr('transform', `translate(8, ${mapH - 70})`);
  leg.append('rect').attr('width', 160).attr('height', 66).attr('fill', 'rgba(5,14,24,0.85)').attr('rx', 3);
  leg.append('text').attr('class', 'legend legend-title').attr('x', 8).attr('y', 15).text('LEGEND');
  const legendItems = [
    { label: 'Home Port',       color: '#e8c96b', dash: null,  r: 5  },
    { label: 'Port of Call',    color: '#c8a84b', dash: null,  r: 4  },
    { label: 'Scenic Cruising', color: '#4a90d9', dash: null,  r: 4  },
    { label: 'Cruise Route',    color: '#d4ae50', dash: '7 5', r: null },
  ];
  legendItems.forEach((item, i) => {
    const ly = 28 + i * 13;
    if (item.dash) {
      leg.append('line').attr('x1', 8).attr('y1', ly).attr('x2', 26).attr('y2', ly)
        .attr('stroke', item.color).attr('stroke-width', 2).attr('stroke-dasharray', item.dash);
    } else {
      leg.append('circle').attr('cx', 17).attr('cy', ly - 1).attr('r', item.r).attr('fill', item.color);
    }
    leg.append('text').attr('class', 'legend').attr('x', 32).attr('y', ly + 3).text(item.label);
  });

  // ── Title / subtitle / watermark (static top-level) ──────────
  svg.append('text').attr('class', 'map-title').attr('x', W/2).attr('y', 24)
    .text(`${itin.name} — ${itin.ship}`);
  if (startDate && endDate) {
    svg.append('text').attr('class', 'map-subtitle').attr('x', W/2).attr('y', 38)
      .text(`${formatDate(startDate)} – ${formatDate(endDate)}`);
  }
  svg.append('text')
    .attr('x', W - 8).attr('y', H - 8)
    .attr('text-anchor', 'end')
    .attr('font-family', 'Arial,sans-serif').attr('font-size', '8px')
    .attr('fill', 'rgba(200,168,75,0.35)')
    .text('Royal Caribbean Cruise Route Mapper');

  // Prime the layers at the identity transform (also resets prior zoom state)
  mapRoot.call(zoomBehavior.transform, d3.zoomIdentity);
}

// ─── Compass rose ─────────────────────────────────────────────────────────────
function drawCompass(g, cx, cy, r) {
  const c = g.append('g').attr('transform', `translate(${cx},${cy})`).attr('opacity', 0.75);
  c.append('circle').attr('r', r).attr('fill', 'rgba(5,14,24,0.85)').attr('stroke', '#c8a84b').attr('stroke-width', 1);
  c.append('polygon').attr('points', `0,${-r+5} 3.5,0 0,-2 -3.5,0`).attr('fill', '#e8c96b');
  c.append('polygon').attr('points', `0,${r-5} 3.5,0 0,2 -3.5,0`).attr('fill', '#3a5a7a');
  [['N',0,-r+2],['S',0,r+9],['E',r+8,3],['W',-r-8,3]].forEach(([l,dx,dy]) => {
    c.append('text').attr('x',dx).attr('y',dy).attr('text-anchor','middle')
      .attr('font-family','Arial').attr('font-size','7px')
      .attr('fill', l==='N' ? '#e8c96b' : '#6a8aaa').attr('font-weight','bold').text(l);
  });
}

// ─── Zoom controls (operate on the same node the zoom behaviour is bound to) ──
document.getElementById('zoom-in').addEventListener('click', () => {
  if (zoomTarget) zoomTarget.transition().duration(280).call(zoomBehavior.scaleBy, 1.6);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  if (zoomTarget) zoomTarget.transition().duration(280).call(zoomBehavior.scaleBy, 0.625);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  if (zoomTarget) zoomTarget.transition().duration(350).call(zoomBehavior.transform, d3.zoomIdentity);
});

// ─── SVG Export ──────────────────────────────────────────────────────────────
// Exports exactly what is on screen, INCLUDING the current zoom/pan, because we
// clone the live SVG without resetting the zoom transform. Styles are injected
// as a single <style> element (never as a second style attribute, which is what
// caused the previous "Attribute style redefined" parse error).
exportBtn.addEventListener('click', () => {
  const svgNode = document.getElementById('cruise-map');

  // Clone the current (zoomed/panned) SVG as-is — the zoom level is preserved.
  const clone = svgNode.cloneNode(true);

  const styleEl = document.createElementNS('http://www.w3.org/2000/svg', 'style');
  styleEl.textContent = `
    .svg-bg { fill: #061220; }
    .ocean-bg { fill: #061220; }
    .land { fill: #233c2d; stroke: #2e5c3a; stroke-width: 0.6; vector-effect: non-scaling-stroke; }
    .borders { fill: none; stroke: #3a5e45; stroke-width: 0.5; vector-effect: non-scaling-stroke; }
    .graticule { fill: none; stroke: rgba(255,255,255,0.04); stroke-width: 0.5; vector-effect: non-scaling-stroke; }
    .route-line-shadow { fill: none; stroke: rgba(0,0,0,0.5); stroke-width: 4.5; stroke-dasharray: 9 7; stroke-linecap: round; }
    .route-line { fill: none; stroke: #d4ae50; stroke-width: 2.5; stroke-dasharray: 9 7; stroke-linecap: round; }
    .port-ring { fill: none; stroke: #e8c96b; stroke-width: 1.2; stroke-dasharray: 3 2; opacity: 0.6; }
    .port-circle { fill: #c8a84b; stroke: #e8d080; stroke-width: 1.5; }
    .port-circle-home { fill: #e8c96b; stroke: #ffffff; stroke-width: 1.8; }
    .port-circle-scenic { fill: #4a90d9; stroke: #80c0ff; stroke-width: 1.5; }
    .port-label-bg { fill: rgba(5,14,24,0.82); }
    .port-label { font-family: Arial, sans-serif; font-size: 10.5px; fill: #eeeeee; text-anchor: middle; }
    .port-label-home { fill: #e8c96b; font-weight: bold; font-size: 11px; }
    .port-label-scenic { fill: #80c0ff; font-size: 10px; }
    .map-title { font-family: Georgia, serif; font-size: 15px; fill: #e8c96b; text-anchor: middle; }
    .map-subtitle { font-family: Arial, sans-serif; font-size: 10.5px; fill: #8a9bb0; text-anchor: middle; }
    .legend { font-family: Arial, sans-serif; font-size: 10px; fill: #8a9bb0; }
    .legend-title { fill: #c8a84b; font-size: 10.5px; }
  `;

  // Strip any pre-existing <style> nodes and inline style attributes so the
  // serialized markup has exactly one style source (avoids duplicate attrs).
  clone.querySelectorAll('style').forEach(s => s.remove());
  clone.removeAttribute('style');
  const defsEl = clone.querySelector('defs');
  if (defsEl) defsEl.appendChild(styleEl);
  else clone.insertBefore(styleEl, clone.firstChild);

  const serializer = new XMLSerializer();
  const svgStr = '<?xml version="1.0" encoding="UTF-8"?>\n' + serializer.serializeToString(clone);
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  const itin = ITINERARIES[itinSelect.value];
  a.download = `RC_${itin.name.replace(/[^a-zA-Z0-9]+/g,'_')}_${itin.ship.replace(/[^a-zA-Z0-9]+/g,'_')}_route.svg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ─── Helpers ──────────────────────────────────────────────────────────────────
function formatDate(s) {
  if (!s) return '';
  return new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
</script>
