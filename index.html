<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Caribbean Cruise Route Mapper</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --navy: #0a1628;
      --ocean: #1a3a5c;
      --blue: #1e6fa8;
      --gold: #c8a84b;
      --gold-light: #e8c96b;
      --white: #f5f5f0;
      --gray: #8a9bb0;
      --panel: #0d1f36;
      --border: #1e3a5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 100%);
      border-bottom: 2px solid var(--gold);
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    header .crown { font-size: 2rem; }
    header h1 {
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      color: var(--gold-light);
    }
    header p {
      font-size: 0.8rem;
      color: var(--gray);
      font-family: 'Arial', sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      height: calc(100vh - 74px);
    }

    .sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--gray);
      margin-bottom: 5px;
      font-family: 'Arial', sans-serif;
      letter-spacing: 0.04em;
    }

    select, input[type="text"], input[type="date"] {
      width: 100%;
      padding: 9px 12px;
      background: #0a1628;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--white);
      font-size: 0.88rem;
      font-family: 'Arial', sans-serif;
      transition: border-color 0.2s;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--gold);
    }

    select option { background: #0a1628; }

    .form-group { margin-bottom: 14px; }

    .date-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: 'Arial', sans-serif;
      cursor: pointer;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: var(--navy);
      font-weight: bold;
    }
    .btn-primary:hover { filter: brightness(1.1); }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      margin-top: 8px;
    }
    .btn-secondary:hover { background: rgba(200,168,75,0.1); }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

    .itinerary-preview {
      background: #071020;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px;
    }

    .port-list { list-style: none; }
    .port-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 0.82rem;
      font-family: 'Arial', sans-serif;
      color: var(--white);
      border-bottom: 1px dashed rgba(255,255,255,0.06);
    }
    .port-list li:last-child { border-bottom: none; }
    .port-dot {
      width: 8px; height: 8px;
      background: var(--gold);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .port-list .connector {
      width: 8px; height: 1px;
      background: none;
      position: relative;
    }

    .map-area {
      position: relative;
      background: #061018;
      overflow: hidden;
    }

    #map-container {
      width: 100%;
      height: 100%;
    }

    svg#cruise-map {
      width: 100%;
      height: 100%;
    }

    .land { fill: #2a4a3a; stroke: #3a6a52; stroke-width: 0.5; }
    .graticule { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 0.5; }
    .ocean-bg { fill: #0a2035; }

    .route-line {
      fill: none;
      stroke: var(--gold);
      stroke-width: 2;
      stroke-dasharray: 8 6;
      stroke-linecap: round;
    }

    .port-circle {
      fill: var(--gold);
      stroke: var(--gold-light);
      stroke-width: 1.5;
      cursor: pointer;
      transition: r 0.2s;
    }
    .port-circle:hover { r: 7; }

    .port-label {
      font-family: 'Arial', sans-serif;
      font-size: 11px;
      fill: #ffffff;
      text-anchor: middle;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .port-label-bg {
      fill: rgba(6,16,24,0.75);
      rx: 3;
    }

    .home-port circle { fill: #e8c96b; r: 7; }

    .map-title {
      font-family: 'Georgia', serif;
      font-size: 16px;
      fill: var(--gold-light);
      text-anchor: middle;
    }

    .map-subtitle {
      font-family: 'Arial', sans-serif;
      font-size: 11px;
      fill: var(--gray);
      text-anchor: middle;
    }

    .compass { opacity: 0.7; }

    .placeholder-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--gray);
      font-family: 'Arial', sans-serif;
    }
    .placeholder-msg .big { font-size: 3rem; margin-bottom: 12px; }
    .placeholder-msg p { font-size: 0.9rem; line-height: 1.6; }

    .legend {
      font-family: 'Arial', sans-serif;
      font-size: 10px;
      fill: var(--gray);
    }
    .legend-title { fill: var(--gold); font-size: 11px; }
  </style>
</head>

        </div>
        <div>

        </div>
      </div>
    </div>

    <div>

      <div class="itinerary-preview" id="itinerary-preview">

    </div>

    <div>

      <button class="btn btn-secondary" id="export-btn" disabled>Export as SVG</button>
    </div>

  </aside>

  <main class="map-area" id="map-container">
    <div class="placeholder-msg" id="placeholder">

    </div>
    <svg id="cruise-map" style="display:none;"></svg>
  </main>
</div>

}

    const d = new Date();
    d.setDate(d.getDate() + 30);
    dateStart.value = d.toISOString().split('T')[0];
  }
  if (!dateEnd.value && dateStart.value) {
    const d = new Date(dateStart.value);
    const nights = itin.ports.length - 1;
    d.setDate(d.getDate() + nights);
    dateEnd.value = d.toISOString().split('T')[0];
  }

  // Render port list
  const uniquePorts = itin.ports.filter((p, i) => !p.returnPort);
  previewEl.innerHTML = `
    <div style="font-size:0.75rem;color:var(--gold);font-family:Arial,sans-serif;margin-bottom:8px;">${itin.name}</div>
    <ul class="port-list">
      ${uniquePorts.map((p, i) => `
        <li>
          <div class="port-dot" style="${p.home ? 'background:#e8c96b;width:10px;height:10px;' : ''}"></div>
          <span>${p.name}${p.home ? ' <span style="color:var(--gold);font-size:0.7em;">(Home Port)</span>' : ''}</span>
        </li>
      `).join('')}
    </ul>
  `;
});

// ─── Generate Map ─────────────────────────────────────────────────────────────
generateBtn.addEventListener('click', async () => {
  const key = itinerarySelect.value;
  if (!key) { alert('Please select an itinerary.'); return; }
  if (!worldData) {
    generateBtn.textContent = 'Loading map data...';
    await loadWorld();
  }

  const itin = ITINERARIES[key];
  const ship = shipSelect.value || 'Royal Caribbean Ship';
  const start = dateStart.value;
  const end = dateEnd.value;

  generateBtn.textContent = 'Generating...';
  setTimeout(() => {
    renderMap(itin, ship, start, end);
    generateBtn.textContent = 'Generate Route Map';
    exportBtn.disabled = false;
    mapGenerated = true;
    placeholder.style.display = 'none';
    svgEl.style.display = 'block';
  }, 50);
});

// ─── Render Map ───────────────────────────────────────────────────────────────
function renderMap(itin, ship, startDate, endDate) {
  const container = document.getElementById('map-container');
  const W = container.clientWidth;
  const H = container.clientHeight;

  const svg = d3.select('#cruise-map')
    .attr('width', W)
    .attr('height', H)
    .attr('viewBox', `0 0 ${W} ${H}`)
    .attr('xmlns', 'http://www.w3.org/2000/svg');

  svg.selectAll('*').remove();

  // Add defs for filters
  const defs = svg.append('defs');
  const glow = defs.append('filter').attr('id', 'glow');
  glow.append('feGaussianBlur').attr('stdDeviation', '2.5').attr('result', 'coloredBlur');
  const feMerge = glow.append('feMerge');
  feMerge.append('feMergeNode').attr('in', 'coloredBlur');
  feMerge.append('feMergeNode').attr('in', 'SourceGraphic');

  // Padding for title/legend
  const padTop = 60, padBottom = 60, padLeft = 20, padRight = 20;
  const mapW = W - padLeft - padRight;
  const mapH = H - padTop - padBottom;

  // Determine projection bounds from itinerary region
  const bounds = REGION_BOUNDS[itin.region];
  const ports = itin.ports;

  // Compute auto-fit bounds from actual port coordinates with padding
  const lons = ports.map(p => p.lon);
  const lats = ports.map(p => p.lat);
  let lon0 = Math.min(...lons), lon1 = Math.max(...lons);
  let lat0 = Math.min(...lats), lat1 = Math.max(...lats);

  // Add padding around ports
  const lonPad = Math.max((lon1 - lon0) * 0.35, 4);
  const latPad = Math.max((lat1 - lat0) * 0.35, 3);
  lon0 -= lonPad; lon1 += lonPad;
  lat0 -= latPad; lat1 += latPad;

  // Use region bounds if they are wider
  if (bounds) {
    lon0 = Math.min(lon0, bounds.lon0);
    lon1 = Math.max(lon1, bounds.lon1);
    lat0 = Math.min(lat0, bounds.lat0);
    lat1 = Math.max(lat1, bounds.lat1);
  }

  const centerLon = (lon0 + lon1) / 2;
  const centerLat = (lat0 + lat1) / 2;

  const projection = d3.geoMercator()
    .center([centerLon, centerLat])
    .fitSize([mapW, mapH], {
      type: 'Feature',
      geometry: {
        type: 'Polygon',
        coordinates: [[[lon0,lat0],[lon1,lat0],[lon1,lat1],[lon0,lat1],[lon0,lat0]]]
      }
    });

  const path = d3.geoPath().projection(projection);

  // Map group offset
  const mapGroup = svg.append('g')
    .attr('transform', `translate(${padLeft}, ${padTop})`);

  // Ocean background
  mapGroup.append('rect')
    .attr('class', 'ocean-bg')
    .attr('width', mapW)
    .attr('height', mapH)
    .attr('rx', 6);

  // Graticule
  const graticule = d3.geoGraticule().step([10, 10]);
  mapGroup.append('path')
    .datum(graticule())
    .attr('class', 'graticule')
    .attr('d', path);

  // Land
  const countries = topojson.feature(worldData, worldData.objects.countries);
  mapGroup.append('path')
    .datum(countries)
    .attr('class', 'land')
    .attr('d', path);

  // Country borders
  mapGroup.append('path')
    .datum(topojson.mesh(worldData, worldData.objects.countries, (a, b) => a !== b))
    .attr('fill', 'none')
    .attr('stroke', '#4a7a5a')
    .attr('stroke-width', 0.3)
    .attr('d', path);

  // Route line
  const routeCoords = ports.map(p => projection([p.lon, p.lat]));
  const lineGenerator = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveCatmullRom.alpha(0.5));

  // Shadow for route
  mapGroup.append('path')
    .datum(routeCoords)
    .attr('fill', 'none')
    .attr('stroke', 'rgba(0,0,0,0.4)')
    .attr('stroke-width', 4)
    .attr('stroke-dasharray', '8 6')
    .attr('d', lineGenerator);

  mapGroup.append('path')
    .datum(routeCoords)
    .attr('class', 'route-line')
    .attr('d', lineGenerator)
    .attr('filter', 'url(#glow)');

  // Port markers and labels
  const uniquePorts = ports.filter((p, i) =>
    !p.returnPort && !ports.slice(0, i).some(q => q.name === p.name)
  );

  uniquePorts.forEach((port) => {
    const [x, y] = projection([port.lon, port.lat]);
    const g = mapGroup.append('g').attr('class', port.home ? 'home-port' : 'port');

    // Outer ring for home port
    if (port.home) {
      g.append('circle')
        .attr('cx', x).attr('cy', y)
        .attr('r', 9)
        .attr('fill', 'none')
        .attr('stroke', '#e8c96b')
        .attr('stroke-width', 1.5)
        .attr('stroke-dasharray', '3 2')
        .attr('opacity', 0.7);
    }

    g.append('circle')
      .attr('class', 'port-circle')
      .attr('cx', x).attr('cy', y)
      .attr('r', port.home ? 6 : 5)
      .attr('fill', port.home ? '#e8c96b' : '#c8a84b')
      .attr('stroke', port.home ? '#fff' : '#e8c96b')
      .attr('stroke-width', 1.5);

    // Label placement: try to avoid overlap
    const labelY = y < mapH * 0.15 ? y + 20 : y - 14;
    const labelX = x;

    // Label background
    const labelText = port.name;
    const charW = 6.2;
    const lblW = labelText.length * charW + 8;
    g.append('rect')
      .attr('x', labelX - lblW / 2)
      .attr('y', labelY - 11)
      .attr('width', lblW)
      .attr('height', 14)
      .attr('class', 'port-label-bg')
      .attr('rx', 2);

    g.append('text')
      .attr('class', 'port-label')
      .attr('x', labelX)
      .attr('y', labelY)
      .text(labelText)
      .attr('font-size', port.home ? '11px' : '10px')
      .attr('font-weight', port.home ? 'bold' : 'normal')
      .attr('fill', port.home ? '#e8c96b' : '#ffffff');
  });

  // Compass rose
  drawCompass(svg, W - 62, H - 62, 32);

  // Title
  svg.append('text')
    .attr('class', 'map-title')
    .attr('x', W / 2)
    .attr('y', 32)
    .text(`${itin.name} — ${ship}`);

  if (startDate && endDate) {
    svg.append('text')
      .attr('class', 'map-subtitle')
      .attr('x', W / 2)
      .attr('y', 48)
      .text(`${formatDate(startDate)} – ${formatDate(endDate)}`);
  }

  // Legend
  const lx = padLeft + 10, ly = padTop + mapH - 54;
  const leg = mapGroup.append('g').attr('transform', `translate(10, ${mapH - 60})`);
  leg.append('rect').attr('width', 148).attr('height', 56).attr('fill', 'rgba(6,16,24,0.8)').attr('rx', 4);
  leg.append('text').attr('class', 'legend legend-title').attr('x', 8).attr('y', 16).text('LEGEND');
  leg.append('line').attr('x1', 8).attr('y1', 30).attr('x2', 28).attr('y2', 30)
    .attr('stroke', '#c8a84b').attr('stroke-width', 2).attr('stroke-dasharray', '5 4');
  leg.append('text').attr('class', 'legend').attr('x', 34).attr('y', 34).text('Cruise Route');
  leg.append('circle').attr('cx', 18).attr('cy', 46).attr('r', 5).attr('fill', '#e8c96b').attr('stroke', '#fff').attr('stroke-width', 1.5);
  leg.append('text').attr('class', 'legend').attr('x', 34).attr('y', 50).text('Home Port / Port of Call');

  // RC watermark
  svg.append('text')
    .attr('x', W - padRight)
    .attr('y', H - 10)
    .attr('text-anchor', 'end')
    .attr('font-family', 'Arial, sans-serif')
    .attr('font-size', '9px')
    .attr('fill', 'rgba(200,168,75,0.4)')
    .text('Royal Caribbean Cruise Route Mapper');
}

function drawCompass(svg, cx, cy, r) {
  const g = svg.append('g').attr('class', 'compass').attr('transform', `translate(${cx},${cy})`);
  g.append('circle').attr('r', r).attr('fill', 'rgba(6,16,24,0.8)').attr('stroke', '#c8a84b').attr('stroke-width', 1);

  // Cardinal arrows
  const pts = [[0,-r+4],[4,0],[0,r-4],[-4,0]];
  // N arrow (gold)
  g.append('polygon').attr('points', `0,${-r+6} 4,0 0,-2 -4,0`).attr('fill', '#e8c96b');
  g.append('polygon').attr('points', `0,${r-6} 4,0 0,2 -4,0`).attr('fill', '#8a9bb0');

  // Cardinal labels
  [['N',0,-r-3],['S',0,r+10],['E',r+7,4],['W',-r-7,4]].forEach(([lbl,dx,dy]) => {
    g.append('text')
      .attr('x', dx).attr('y', dy)
      .attr('text-anchor', 'middle')
      .attr('font-family', 'Arial').attr('font-size', '8px')
      .attr('fill', lbl === 'N' ? '#e8c96b' : '#8a9bb0')
      .attr('font-weight', 'bold')
      .text(lbl);
  });
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

// ─── SVG Export ───────────────────────────────────────────────────────────────
exportBtn.addEventListener('click', () => {
  const svgNode = document.getElementById('cruise-map');
  const serializer = new XMLSerializer();
  let svgStr = serializer.serializeToString(svgNode);

  // Inject styles inline
  const styles = `
    <style>
      text { font-family: Arial, sans-serif; }
      .ocean-bg { fill: #0a2035; }
      .land { fill: #2a4a3a; stroke: #3a6a52; stroke-width: 0.5; }
      .graticule { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 0.5; }
      .route-line { fill: none; stroke: #c8a84b; stroke-width: 2; stroke-dasharray: 8 6; stroke-linecap: round; }
      .port-circle { fill: #c8a84b; stroke: #e8c96b; stroke-width: 1.5; }
      .port-label { font-size: 10px; fill: #ffffff; text-anchor: middle; }
      .port-label-bg { fill: rgba(6,16,24,0.75); }
      .map-title { font-family: Georgia, serif; font-size: 16px; fill: #e8c96b; text-anchor: middle; }
      .map-subtitle { font-family: Arial, sans-serif; font-size: 11px; fill: #8a9bb0; text-anchor: middle; }
    </style>
  `;
  svgStr = svgStr.replace('<svg', `<svg style="background:#0a1628"` );
  svgStr = svgStr.replace('</defs>', `</defs>${styles}`);

  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;

  const itin = ITINERARIES[itinerarySelect.value];
  const ship = (shipSelect.value || 'cruise').replace(/\s+/g, '_');
  a.download = `${itin ? itin.name.replace(/\s+/g,'_') : 'cruise'}_${ship}_route.svg`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
